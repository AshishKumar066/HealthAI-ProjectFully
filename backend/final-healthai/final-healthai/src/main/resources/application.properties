spring.application.name=HealthAI-Hospital-Backend
server.port=8080

# ==============================
# MySQL Database Configuration
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Ashish@123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================
# JWT Configuration
# ==============================
app.jwt.secret=healthai-hospital-super-secret-key-change-this-2026
app.jwt.expiration-ms=86400000

# ==============================
# React / Frontend CORS
# ==============================
#app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
#app.cors.allowed-origins=http://localhost:5175,http://localhost:5173,http://localhost:3000
     app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# ==============================
# File Upload
# ==============================
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Demo data
app.seed-demo-data=true

# Application timezone
app.timezone=Asia/Kolkata

# Actuator
management.endpoints.web.exposure.include=health,info
